      --wb: #fff2d6;
      --gold: #d98a1c;

        --bg: #0e1412;
        --card: #17201c;
        --tx: #ecf2ef;
        --mu: #9baba5;
        --br: #2b3833;
        --ac: #37c296;
        --ac2: #142f25;
        --ac3: #1c473b;

        --gold: #e69d2e;
        --goldb: #36270e;

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--card);
      border-bottom: 1px solid var(--br);

    .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
    .brand-dot {
      width: 24px; height: 24px; border-radius: 7px;
      background: var(--ac); color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
    }
    nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    button, input, select, textarea {
      font: inherit; color: var(--tx); border-radius: 10px; border: 1px solid var(--br);
    }
    button { background: var(--card); padding: 8px 13px; cursor: pointer; font-weight: 600; }
    button.on, button.pri { background: var(--ac); color: #fff; border-color: var(--ac); }
    button.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
    @media (prefers-color-scheme: dark) {
      button.on, button.pri, button.gold { color: #091310; }
    }
    input, select, textarea { width: 100%; padding: 9px 11px; background: var(--bg); }
    label { display: block; font-size: 12.5px; color: var(--mu); margin: 10px 0 4px; font-weight: 600; }
    .card {
      background: var(--card); border: 1px solid var(--br);
      border-radius: var(--r); padding: 18px; margin-bottom: 14px;
    }
    .hero-banner {
      background: linear-gradient(120deg, var(--ac3), var(--ac));
      color: #fff; border-radius: 16px; padding: 24px; margin-bottom: 16px;
    }
    .hero-banner .mu { color: #d5ece4; }
    .hero-card {
      background: #fff; color: #14221d; border-radius: 14px; padding: 16px;
      border: 1px solid rgba(255,255,255,.25);
    }
    .grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
    .grid3 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    h1 { margin: 8px 0; font-size: 30px; line-height: 1.18; }
    h2 { margin: 0 0 8px; font-size: 19px; }
    h3 { margin: 0 0 6px; font-size: 16px; }
    .mu { color: var(--mu); font-size: 13.5px; }
    .num { font-size: 30px; font-weight: 800; color: var(--ac); line-height: 1.1; }
    .pill {
      display: inline-block; font-size: 11.5px; padding: 3px 10px;
      border-radius: 999px; margin: 2px 4px 2px 0;
      background: var(--ac2); color: var(--ac); border: 1px solid var(--br); font-weight: 600;
    }
    .pill.w { background: var(--wb); color: var(--wa); }
    .pill.g { background: var(--goldb); color: var(--wa); }
    .two-box { border-radius: 12px; padding: 14px; border: 1px solid var(--br); }
    .two-box.v { background: var(--ac2); border-color: #9ad1bb; }
    .two-box.s { background: var(--goldb); border-color: #ecc88b; }
    .score-ring {
      width: 50px; height: 50px; border-radius: 999px;
      border: 4px solid var(--ac); display: inline-flex;
      align-items: center; justify-content: center; font-weight: 800; font-size: 16px;
      flex-shrink: 0;
    }
    .avatar {
      width: 38px; height: 38px; border-radius: 9px;
      background: var(--ac2); color: var(--ac); border: 1px solid var(--br);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; flex-shrink: 0;
    }
    .bar { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--br); }
    .bar > i { display: block; height: 100%; background: var(--ac); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .quote {
      border-left: 3px solid var(--ac); padding-left: 10px;
      margin-top: 6px; color: var(--mu); font-size: 13px;
    }
    .passport-banner {
      background: linear-gradient(125deg, var(--ac3), var(--ac));
      color: #fff; border-radius: 14px; padding: 20px; margin-bottom: 14px;
    }
    .passport-banner .mu { color: #d6ece4; }
    .passport-banner .ring-light {
      width: 58px; height: 58px; border-radius: 999px;
      border: 4px solid #63e2b7; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
    }
    .foot-note {
      border-top: 1px solid var(--br); margin-top: 24px; padding-top: 14px;
      font-size: 12.5px; color: var(--mu);
    }
    @media print {
      header, nav, .no-print { display: none !important; }
      body { background: #fff; color: #000; }
      .card, .passport-banner { border: 1px solid #ccc; box-shadow: none; }
    }
  </style>
</head>

          return '<div class="card" style="padding:12px;margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>' +
            esc(s[0]) + '</b><span class="pill">●●● ' + esc(s[1]) + '</span></div>' +
            '<div class="mu" style="font-size:12px">' + esc(s[2]) + '</div><div class="mu" style="margin-top:4px">' + esc(s[3]) + '</div>' +
            '<div class="quote">“' + esc(s[4]) + "”</div></div>";
        }).join("") + "</div>" +
        '<div class="card"><h2>Highlighted projects</h2><div class="mu" style="margin-bottom:10px">Summarised from the candidate’s case studies</div>' +
        p.projects.map(function (pr) {
          return '<div class="card" style="background:var(--bg);margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>' +
            esc(pr.title) + '</b><span class="pill">' + esc(pr.detailTag) + '</span></div>' +
            '<p class="mu" style="margin:8px 0">' + esc(pr.summary) + "</p>" +
            "<div>" + pr.chips.map(function (c) { return '<span class="pill">◎ ' + esc(c) + "</span>"; }).join("") + "</div>" +
            '<div class="mu" style="font-size:12px;margin-top:8px">' + esc(pr.meta) + "</div>" +
            (pr.link ? '<div style="margin-top:6px"><a href="' + esc(pr.link) + '" target="_blank" style="color:var(--ac);font-size:13px">↗ ' + esc(pr.link) + "</a></div>" : "") + "</div>";
        }).join("") + "</div>" +
        '<div class="card"><h2>Real-world strengths</h2><div class="mu" style="margin-bottom:10px">Patterns in how this person works</div>' +
        '<div class="grid2">' + p.strengths.map(function (st) {
          var isEv = st[1] === "From evidence";
          return '<div class="card" style="margin-bottom:0"><div class="row" style="justify-content:space-between"><b>' +
            esc(st[0]) + '</b><span class="pill ' + (isEv ? "" : "g") + '">' + (isEv ? "◎ " : "✎ ") + esc(st[1]) + '</span></div>' +
            '<div class="quote">“' + esc(st[2]) + "”</div></div>";
        }).join("") + "</div></div>" +
        '<div class="card"><div class="row" style="justify-content:space-between"><h2>Compliance and payment readiness</h2>' +
        '<div><span class="num" style="font-size:24px">' + p.compliance + '</span><span class="mu">/100</span> <span class="pill">◎ ' + esc(p.complianceStatus) + "</span></div></div>" +
        '<div class="mu" style="margin-bottom:10px">Can this person be contracted and paid? Declared by the candidate; documents were not inspected.</div>' +
        '<div class="grid3">' + p.complianceItems.map(function (ci) {
          return '<div class="card" style="background:var(--bg);margin-bottom:0"><div class="mu" style="font-size:11px;text-transform:uppercase">' +
            esc(ci[0]) + '</div><div style="margin:4px 0"><b>' + esc(ci[1]) + '</b></div><span class="pill">◎ ' + esc(ci[2]) + "</span></div>";
        }).join("") + '</div><div class="grid2" style="margin-top:10px">' + p.contracts.map(function (ct) {
          return '<div class="card" style="margin-bottom:0"><div class="row" style="justify-content:space-between"><b>' +
            esc(ct[0]) + '</b><span class="pill">◎ ' + esc(ct[1]) + '</span></div><div class="mu">' + esc(ct[2]) + "</div></div>";
        }).join("") + "</div></div>" +
        '<div class="card"><h2>Bridging and upskilling recommendations</h2><div class="mu" style="margin-bottom:8px">Next steps that would strengthen this passport</div>' +
        '<div class="card" style="background:var(--bg);margin-bottom:0"><b>Turn stated skills into evidence: ' + esc(p.selfReportedSkills.join(" & ")) +
        '</b><div class="mu">' + esc(p.bridging) + "</div></div></div>" +
        '<div class="card"><h2>Work readiness notes</h2><div class="mu" style="margin-bottom:8px">For hiring managers and mentors</div>' +
        p.readinessNotes.map(function (rn) { return '<div class="mu" style="margin:6px 0">◎ ' + esc(rn) + "</div>"; }).join("") + "</div>" +
        '<div class="two-box s" style="margin-bottom:14px"><h2>Self-reported claims</h2><div class="mu" style="margin-bottom:10px">Stated by the candidate. Not checked, and not used to set any skill level.</div>' +
        '<div class="grid2"><div><div class="mu" style="font-size:11px">LOCATION</div><b>' + esc(p.location) + '</b></div>' +
        '<div><div class="mu" style="font-size:11px">LANGUAGES</div><b>' + esc(p.langs.join(", ")) + '</b></div>' +
        '<div><div class="mu" style="font-size:11px">TARGET ROLE</div><b>' + esc(p.role) + '</b></div>' +
        '<div><div class="mu" style="font-size:11px">EXPERIENCE</div><b>' + esc(p.exp) + '</b></div></div>' +
        '<div style="margin-top:10px"><div class="mu" style="font-size:11px">BACKGROUND AND GOALS</div><div class="mu">' + esc(p.bio) + "</div></div>" +
        '<div style="margin-top:10px"><div class="mu" style="font-size:11px">SKILLS MENTIONED WITHOUT SUPPORTING EVIDENCE</div>' +
        p.selfReportedSkills.map(function (sk) { return '<span class="pill g">✎ ' + esc(sk) + "</span>"; }).join("") + "</div></div>" +
        '<div class="card"><h2>Verification and trust breakdown</h2><div class="mu" style="margin-bottom:10px">Evidence score ' + p.score + " out of 100 · " + esc(p.levelLabel) + "</div>" +
        p.breakdown.map(function (b) {
          return '<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>' +
            esc(b[0]) + '</b><b>' + esc(b[1]) + '</b></div><div class="bar" style="margin:4px 0"><i style="width:' + b[2] +
            '%"></i></div><div class="mu" style="font-size:12px">' + esc(b[3]) + "</div></div>";
        }).join("") +
        (p.repoCard ? '<div class="card" style="background:var(--bg);margin-top:12px"><b>⌘ ' + esc(p.repoCard.name) +
        '</b><div class="mu">' + esc(p.repoCard.desc) + '</div><div class="mu" style="font-size:12px;margin-top:6px">' +
        esc(p.repoCard.stats) + '</div><div style="margin-top:6px"><a href="' + esc(p.repoCard.url) +
        '" target="_blank" style="color:var(--ac);font-size:13px">↗ ' + esc(p.repoCard.url) + "</a></div></div>" : "") +
        '<div class="two-box s" style="margin-top:12px"><div class="mu" style="margin-bottom:0"><b>What this does and does not confirm.</b> The analysis reads the candidate’s project descriptions and public repository contents. It does not confirm identity, authorship of a repository, or formal qualifications. Use it to decide who to interview, and ask about the evidence quoted above.</div></div>' +
        '<div class="mu" style="font-size:11.5px;margin-top:12px">' + esc(p.code) + " · " + esc(shareUrl) + "</div></div>" +
        '<div class="card no-print"><div class="row" style="justify-content:space-between"><h2>Share this passport</h2><span class="pill ' +
        (isShared ? "" : "g") + '">' + (isShared ? "Public" : "🔒 Private") + "</span></div>" +
        '<div class="mu" style="margin-bottom:12px">' + (isShared ? "Listed in Talent Explorer and shareable via link." : "Private: not listed in the Talent Explorer. Only people you send the link to can open it.") + "</div>" +
        '<div class="grid2"><button class="pri" onclick="copyLink(\'' + esc(shareUrl) + '\')">🔗 Copy Shareable Link</button>' +
        '<button onclick="window.print()">🖨 Print / Save as PDF</button>' +
        '<button onclick="togglePublic(\'' + p.id + '\')">' + (isShared ? "🔒 Make private" : "◎ Make public") + '</button>' +
        '<button class="gold" onclick="requestIntro(\'' + p.id + '\')">' + (requested ? "✓ Intro / Interview Requested" : "✈ Request Intro / Interview") + "</button></div>" +
        '<div class="row" style="margin-top:12px"><button onclick="go(\'create\')">+ Create another passport</button>' +
        '<button onclick="toggleShortlist(\'' + p.id + '\')">' + (inShort ? "✓ Saved in Shortlist" : "Add to Shortlist") + "</button></div></div>";
    }

    function copyLink(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).catch(function () {});
      }
      alert("Link copied: " + url);
    }

    function togglePublic(id) {
      var p = PROFILES.find(function (x) { return x.id === id; });
      if (p) { p.shared = p.shared === 1 ? 0 : 1; saveState(); render(); }
    }

    function vTalent() {
      var skills = {}, roles = {}, langs = {}, locs = {};
      PROFILES.forEach(function (p) {
        roles[p.role] = 1;
        locs[p.location] = 1;
        p.langs.forEach(function (l) { langs[l] = 1; });
        p.verifiedSkills.forEach(function (s) { skills[s[0]] = 1; });
      });
      var mk = function (map, cur, label) {
        return '<option value="">' + esc(label) + "</option>" + Object.keys(map).sort().map(function (k) {
          return '<option value="' + esc(k) + '"' + (k === cur ? " selected" : "") + ">" + esc(k) + "</option>";
        }).join("");
      };

      var list = PROFILES.filter(function (p) {
        var q = app.q.toLowerCase();
        if (q && (p.name + " " + p.role + " " + p.location).toLowerCase().indexOf(q) === -1) return false;
        if (app.skill && !p.verifiedSkills.some(function (s) { return s[0] === app.skill; })) return false;
        if (app.role && p.role !== app.role) return false;
        if (app.lang && p.langs.indexOf(app.lang) === -1) return false;
        if (app.loc && p.location !== app.loc) return false;
        if (p.score < app.minScore) return false;
        return true;
      });

      return '<div class="card"><h1>Talent Explorer</h1><div class="mu" style="margin-bottom:12px">Find people by what they have shown they can do. Skill filters match verified skills only, never self-reported claims.</div>' +
        '<input value="' + esc(app.q) + '" placeholder="🔍 Search name, skill, role or location" oninput="app.q=this.value;render()">' +
        '<div class="grid2"><div><label>Verified skill</label><select onchange="app.skill=this.value;render()">' + mk(skills, app.skill, "Any skill") + "</select></div>" +
        '<div><label>Target role</label><select onchange="app.role=this.value;render()">' + mk(roles, app.role, "Any role") + "</select></div>" +
        '<div><label>Language</label><select onchange="app.lang=this.value;render()">' + mk(langs, app.lang, "Any language") + "</select></div>" +
        '<div><label>Location</label><select onchange="app.loc=this.value;render()">' + mk(locs, app.loc, "Any location") + "</select></div></div>" +
        '<label>Minimum Evidence Score: <span style="float:right">' + (app.minScore ? app.minScore + "+" : "Any") + '</span></label>' +
        '<input type="range" min="0" max="95" step="5" value="' + app.minScore + '" oninput="app.minScore=+this.value;render()">' +
        '<div style="margin-top:12px"><span class="pill">☰ Shortlist (' + app.shortlist.length + ")</span></div></div>" +
        '<div class="mu" style="margin-bottom:10px">' + list.length + " profiles · sorted by evidence score</div>" +
        '<div class="grid2">' + list.map(function (p) { return profileCard(p, true); }).join("") + "</div>";
    }

    render();
  </script>
</body>
</html>
