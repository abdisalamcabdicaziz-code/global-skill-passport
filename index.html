<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Skill Passport</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--tx:#1d2a26;--mu:#5d6b66;--br:#dcd8cd;--ac:#0b7a5c;--ac2:#e8f4ef;--wa:#b36b00;--wb:#fff3dc;--rd:#a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e9efec;--mu:#9bada6;--br:#2f3b36;--ac:#3fc59a;--ac2:#163328;--wa:#f0b04a;--wb:#35290f;--rd:#f08080;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#e9efec;--mu:#9bada6;--br:#2f3b36;--ac:#3fc59a;--ac2:#163328;--wa:#f0b04a;--wb:#35290f;--rd:#f08080;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--br);z-index:5}
.in{max-width:1000px;margin:0 auto;padding:12px 16px}
.logo{font-weight:800;font-size:18px}.logo span{color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--br);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
body.dk button.on{color:#000}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--br);border-radius:8px;background:var(--bg)}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
h1{font-size:28px;line-height:1.2;margin:.2em 0}h2{margin:.2em 0 .5em;font-size:20px}h3{margin:.2em 0;font-size:16px}
.mu{color:var(--mu);font-size:14px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;margin:2px 4px 2px 0;background:var(--ac2);color:var(--ac);border:1px solid var(--br)}
.chip.w{background:var(--wb);color:var(--wa)}.chip.p{background:var(--bg);color:var(--mu)}
.bar{height:10px;background:var(--bg);border:1px solid var(--br);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.bar i.w{background:var(--wa)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}
.big{font-size:34px;font-weight:800;color:var(--ac)}
.stage{display:flex;gap:4px;margin:8px 0}.stage div{flex:1;height:6px;border-radius:3px;background:var(--br)}.stage div.d{background:var(--ac)}
.ev{border-left:4px solid var(--ac);padding:6px 10px;margin:8px 0;background:var(--ac2);border-radius:0 8px 8px 0}.ev.u{border-color:var(--wa);background:var(--wb)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--br);padding:6px;text-align:left}
.hero{background:var(--ac2)}
@media(max-width:520px){h1{font-size:23px}}
</style></head><body>
<header><div class="in"><div class="logo">🛂 Global <span>Skill Passport</span></div>
<nav id="nav"></nav></div></header>
<main id="app"></main>
<script>
var ROLES={'Frontend Developer':['JavaScript','React','HTML/CSS','Git','Accessibility'],'Backend Developer':['Python','APIs','SQL','Git','Testing'],'Data Analyst':['SQL','Python','Excel','Data Viz','Statistics'],'Digital Marketing Specialist':['SEO','Analytics','Content','Social Media','Excel']};
var CHK=['Identity document on file (or UNHCR/ID alternative)','Payment pathway set (mobile money, digital wallet or bank)','Remote-contract work eligibility confirmed','Contract and tax basics reviewed','Reliable device and connectivity plan'];
var VIEWS=[['home','Home'],['eval','Evaluator'],['pass','Passport'],['talent','Talent Explorer']];
function P(id,name,origin,role,langs,skills,ev,br,comp,shared,note){return{id:id,name:name,origin:origin,base:'Kakuma, Kenya (remote-ready)',role:role,langs:langs,skills:skills.map(function(s){return{n:s[0],v:s[1]}}),ev:ev.map(function(e){return{t:e[0],type:e[1],pts:e[2],ver:e[3],how:e[4]}}),br:br,comp:comp,shared:shared,note:note,intro:false}}
var S=[
P('a','Amina H.','Damascus-trained software engineer','Frontend Developer',['Arabic','English'],[['JavaScript',1],['React',1],['HTML/CSS',1],['Git',1],['Accessibility',0]],[['Arabic-RTL job board (React)','Repo + live demo',25,1,'Code reviewed against PLP rubric v2 by 2 partner mentors'],['Open-source PR to a UI library','Repo contribution',20,1,'Merged PR verified via commit history'],['BSc Computer Science (Syria), transcript unavailable','Credential claim',15,0,'No documents; use skills-based route']],['Take the accessibility practical assessment','Add a verified employer reference after first micro-contract'],[1,1,1,0,1],1,'Credential papers lost; competence proven through shipped work.'),
P('b','Yonas T.','Eritrean-born data analyst','Data Analyst',['Tigrinya','English','Arabic'],[['SQL',1],['Python',1],['Excel',1],['Data Viz',0],['Statistics',0]],[['Clinic attendance dashboard case study','Practical case study',25,1,'Rubric scored 4/5 on method, reproducibility, insight'],['Python notebook on refugee-camp food prices','Repo',15,0,'Awaiting reviewer'],['Self-reported: 4 yrs analyst at NGO','Experience claim',15,0,'Reference not yet collected']],['Complete a recognised statistics micro-credential (bridging)','Request NGO reference letter'],[1,1,0,1,1],1,'Strong analysis; needs formal stats bridging.'),
P('c','Layla M.','Iraqi digital marketer','Digital Marketing Specialist',['Arabic','Kurdish','English'],[['SEO',1],['Analytics',1],['Content',0],['Social Media',1],['Excel',0]],[['SEO audit for a Nairobi SME','Client case study',25,1,'Client confirmation plus rubric review'],['Content calendar portfolio','Portfolio',15,0,'Self-hosted, unverified']],['Google Analytics certification (bridging)','Collect second client reference'],[1,0,1,1,1],1,'Local-market client work gives Kenyan experience.'),
P('d','Samuel K.','South Sudanese backend developer','Backend Developer',['English','Arabic','Dinka'],[['Python',1],['APIs',1],['SQL',0],['Git',1],['Testing',0]],[['Mobile-money payments API (Python)','Repo + tests',25,1,'Tests run in sandbox; rubric passed'],['Diploma in IT, scanned copy only','Credential claim',15,0,'Needs issuer verification']],['Add SQL practical test','Add automated tests to 2 more repos'],[1,1,1,1,0],0,'Private by default until he chooses to share.')];
var st={v:'home',pid:'a',res:null};
try{var sv=JSON.parse(localStorage.getItem('gsp'));if(sv)S.forEach(function(p){if(sv[p.id]){p.shared=sv[p.id].shared;p.comp=sv[p.id].comp}})}catch(e){}
function save(){try{var o={};S.forEach(function(p){o[p.id]={shared:p.shared,comp:p.comp}});localStorage.setItem('gsp',JSON.stringify(o))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sc(p){var v=0,u=0;p.ev.forEach(function(e){e.ver?v+=e.pts:u+=e.pts});var evs=Math.min(100,Math.round(v+.3*u));var nv=p.skills.filter(function(s){return s.v}).length;var rd=Math.round(p.comp.filter(Boolean).length/CHK.length*100);var req=ROLES[p.role]||[];var fit=req.length?Math.round(req.filter(function(r){return p.skills.some(function(s){return s.n===r&&s.v})}).length/req.length*100):0;var idx=Math.round(.5*evs+.25*rd+.25*fit);var stg=[evs>=40,rd>=80,fit>=60];stg.push(stg[0]&&stg[1]&&stg[2]);return{v:v,u:u,evs:evs,nv:nv,rd:rd,fit:fit,idx:idx,stg:stg,ratio:p.skills.length?Math.round(nv/p.skills.length*100):0}}
function bar(l,n,w){return '<div class="mu" style="margin-top:8px">'+l+' <b>'+n+'%</b></div><div class="bar"><i class="'+(w||'')+'" style="width:'+n+'%"></i></div>'}
function go(v){st.v=v;render();window.scrollTo(0,0)}
function render(){document.getElementById('nav').innerHTML=VIEWS.map(function(x){return '<button class="'+(st.v===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');document.getElementById('app').innerHTML=({home:home,eval:evalV,pass:passV,talent:talentV})[st.v]()}
function home(){var all=S.map(sc),n=S.length,sh=S.filter(function(p){return p.shared}).length,avg=Math.round(all.reduce(function(a,b){return a+b.idx},0)/n),pl=all.filter(function(x){return x.stg[3]}).length;
var steps=['Submit real work: repos, case studies, projects','Rubric check: auto-checks, then partner reviewers verify','Bridge gaps: micro-credentials, assessments, references','Get compliance-ready: ID, payment, contract, eligibility','Share passport (opt-in) and get matched to roles'];
return '<div class="card hero"><span class="chip">PLP × ILO Mini-Hackathon · Track 1 · SDG 4 &amp; 8</span><h1>Skills speak when paperwork can’t.</h1><p>Skilled refugees lose years to brain waste because degrees and documents go missing. Global Skill Passport turns real projects into verified, shareable evidence, clearly separated from self-reported claims, and maps it to compliance readiness and real employer roles.</p><div class="row"><button class="pri" onclick="go(\'eval\')">Test the Evaluator</button><button onclick="go(\'pass\')">View a Passport</button><button onclick="go(\'talent\')">Explore Talent</button></div></div>'+
'<div class="grid"><div class="card"><h2>How it works</h2>'+steps.map(function(s,i){return '<p><b>'+(i+1)+'.</b> '+s+'</p>'}).join('')+'</div><div class="card"><h2>Measurable impact (live from data)</h2><div class="big">'+pl+'/'+n+'</div><div class="mu">candidates at full pipeline stage (validated, compliant, role-matched)</div>'+bar('Average Passport Index',avg)+bar('Passports shared by choice',Math.round(sh/n*100))+'<p class="mu">SDG 8: pathway from validated skill to remote or local work. SDG 4: bridging steps show targeted upskilling.</p></div></div>'+
'<div class="card"><h2>Built to scale</h2><p class="mu">Rubrics are plain configuration (role → required skills, evidence type → points), so new cohorts, sectors and regions add a rubric, not manual review. Auto-checks screen submissions; partner reviewers only confirm what passes. Evidence is always labelled Verified, Provisional or Self-reported.</p></div>'}
function evalV(){var p=S.find(function(x){return x.id===st.pid})||S[0];
return '<div class="grid"><div class="card"><h2>Evaluate a sample profile</h2><label>Sample candidate</label><select id="sp" onchange="st.pid=this.value">'+S.map(function(x){return '<option value="'+x.id+'"'+(x.id===st.pid?' selected':'')+'>'+esc(x.name)+' — '+esc(x.role)+'</option>'}).join('')+'</select><p><button class="pri" onclick="runS()">Run evaluation</button></p><p class="mu">Scoring: verified evidence counts fully; provisional (unreviewed) counts 30%; self-reported claims count only as listed skills.</p></div>'+
'<div class="card"><h2>Submit a new project</h2><form onsubmit="return runN(event)"><label>Your name</label><input id="nn" required maxlength="40"><label>Target role</label><select id="nr">'+Object.keys(ROLES).map(function(r){return '<option>'+r+'</option>'}).join('')+'</select><label>Skills you claim (comma separated)</label><input id="ns" placeholder="Python, SQL, Git"><label>Languages (comma separated)</label><input id="nl" placeholder="Arabic, English"><label>Project / repo link</label><input id="nk" placeholder="https://github.com/you/project"><label>Case study or project note</label><textarea id="nt" rows="3" placeholder="What you built, tools used, tests, results, your role"></textarea><p><button class="pri" type="submit">Evaluate and create private passport</button></p></form></div></div><div id="out">'+(st.res?result(st.res):'')+'</div>'}
function runS(){st.res=st.pid;document.getElementById('out').innerHTML=result(st.pid)}
function runN(e){e.preventDefault();var g=function(i){return document.getElementById(i).value.trim()},link=g('nk'),note=g('nt'),checks=[],pts=0;
function ck(ok,l,w){checks.push([ok,l,w]);if(ok)pts+=w}
var okUrl=/^https?:\/\/[^\s]+\.[^\s]+/.test(link),repo=/^https:\/\/(www\.)?(github|gitlab|bitbucket)\.(com|org)\//.test(link);
ck(okUrl,'Valid project link provided',10);ck(repo,'Link is on a recognised code host',10);ck(note.length>=60,'Case-study note has enough detail (60+ characters)',10);ck(/test|spec|ci\b/i.test(note),'Mentions testing',10);ck(/demo|live|deploy|users?|client/i.test(note),'Mentions deployment, users or a client',10);ck(/readme|document/i.test(note),'Mentions documentation',10);
var sk=g('ns').split(',').map(function(s){return s.trim()}).filter(Boolean).slice(0,12),role=g('nr');
var id='n'+Date.now();var p=P(id,esc(g('nn')),'Self-submitted profile',role,g('nl').split(',').map(function(s){return esc(s.trim())}).filter(Boolean),sk.map(function(s){return[esc(s),0]}),[[okUrl?esc(link.slice(0,60)):'Project note (no valid link)',repo?'Repo (auto-checked)':'Project note',pts,0,'Provisional: awaiting partner reviewer']],[],[0,0,0,0,0],0,'');
var req=ROLES[role]||[];p.br=req.filter(function(r){return !sk.some(function(s){return s.toLowerCase()===r.toLowerCase()})}).map(function(r){return 'Skills gap for '+role+': take a practical assessment in '+r});
p.br.push('Submit to a partner reviewer to convert provisional evidence into verified');p.br.push('No degree papers? Use skills-based validation or the UNESCO Qualifications Passport as a bridge');p.checks=checks;S.push(p);st.pid=id;st.res=id;save();document.getElementById('out').innerHTML=result(id);document.getElementById('out').scrollIntoView();return false}
function result(id){var p=S.find(function(x){return x.id===id});if(!p)return '';var s=sc(p);var miss=(ROLES[p.role]||[]).filter(function(r){return !p.skills.some(function(k){return k.n===r&&k.v})});
return '<div class="card"><h2>Evaluation: '+p.name+'</h2><div class="grid"><div><div class="big">'+s.evs+'</div><div class="mu">Evidence score (0–100)</div>'+bar('Verified evidence points',Math.min(100,s.v))+bar('Provisional / self-reported points',Math.min(100,s.u),'w')+bar('Skills verified',s.ratio)+'</div><div>'+bar('Compliance readiness',s.rd)+bar('Market fit for '+esc(p.role),s.fit)+bar('Passport Index',s.idx)+'</div></div>'+
(p.checks?'<h3>Auto-check results</h3>'+p.checks.map(function(c){return '<div>'+(c[0]?'✅':'⬜')+' '+c[1]+' <span class="mu">(+'+c[2]+')</span></div>'}).join(''):'')+
'<h3 style="margin-top:12px">Evidence</h3>'+p.ev.map(evH).join('')+'<h3>Bridging and re-certification</h3>'+(p.br.map(function(b){return '<div>➡️ '+esc(b)+'</div>'}).join(''))+'<h3 style="margin-top:12px">Compliance and market notes</h3><div class="mu">'+(s.rd>=80?'Ready for remote or contract onboarding.':'Complete the checklist before placement: '+CHK.filter(function(c,i){return !p.comp[i]}).map(function(c){return c.split(' (')[0].toLowerCase()}).join('; ')+'.')+' '+(miss.length?'To match '+esc(p.role)+' roles, verify: '+miss.join(', ')+'.':'All core skills for this role are verified.')+'</div><p><button class="pri" onclick="st.pid=\''+p.id+'\';go(\'pass\')">Open passport</button></p></div>'}
function evH(e){return '<div class="ev'+(e.ver?'':' u')+'"><b>'+e.t+'</b> <span class="chip'+(e.ver?'':' w')+'">'+(e.ver?'Verified':'Unverified')+'</span><span class="chip p">'+e.type+' · '+e.pts+' pts</span><div class="mu">'+e.how+'</div></div>'}
function passV(){var p=S.find(function(x){return x.id===st.pid})||S[0],s=sc(p);
return '<div class="card"><label>Choose passport</label><select onchange="st.pid=this.value;render()">'+S.map(function(x){return '<option value="'+x.id+'"'+(x.id===p.id?' selected':'')+'>'+x.name+(x.shared?'':' (private)')+'</option>'}).join('')+'</select></div>'+
'<div class="card"><div class="row" style="justify-content:space-between"><div><h2>🛂 '+p.name+'</h2><div class="mu">'+esc(p.origin)+' · '+p.base+'<br>Target: <b>'+esc(p.role)+'</b> · '+(p.langs.join(', ')||'n/a')+'</div></div><div><span class="chip'+(p.shared?'':' w')+'">'+(p.shared?'🌍 Shared: discoverable':'🔒 Private: only you can see this')+'</span><p><button class="'+(p.shared?'':'pri')+'" onclick="tog(\''+p.id+'\')">'+(p.shared?'Make private':'Share with employers')+'</button></p></div></div>'+(p.note?'<p class="mu">'+p.note+'</p>':'')+'</div>'+
'<div class="grid"><div class="card"><h2>Skills</h2><h3>Verified</h3>'+(p.skills.filter(function(k){return k.v}).map(function(k){return '<span class="chip">✔ '+esc(k.n)+'</span>'}).join('')||'<span class="mu">None yet</span>')+'<h3>Self-reported</h3>'+(p.skills.filter(function(k){return !k.v}).map(function(k){return '<span class="chip w">'+esc(k.n)+'</span>'}).join('')||'<span class="mu">None</span>')+'<h2 style="margin-top:14px">Score breakdown</h2><div class="big">'+s.idx+'</div>'+bar('Evidence score',s.evs)+bar('Compliance readiness',s.rd)+bar('Market fit',s.fit)+'</div>'+
'<div class="card"><h2>Portfolio evidence</h2>'+p.ev.map(evH).join('')+'<h2>Bridging steps</h2>'+p.br.map(function(b){return '<div>➡️ '+esc(b)+'</div>'}).join('')+'</div></div>'+
'<div class="card"><h2>Compliance checklist <span class="mu">(self-attested, tap to update)</span></h2>'+CHK.map(function(c,i){return '<div><label style="display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--tx);font-size:15px"><input type="checkbox" style="width:auto" '+(p.comp[i]?'checked':'')+' onchange="chk(\''+p.id+'\','+i+',this.checked)">'+c+'</label></div>'}).join('')+'</div>'}
function tog(id){var p=S.find(function(x){return x.id===id});p.shared=!p.shared;save();render()}
function chk(id,i,v){var p=S.find(function(x){return x.id===id});p.comp[i]=v?1:0;save();render()}
var F={q:'',sk:'',ro:'',la:'',min:0};
function talentV(){var sk={},la={};S.forEach(function(p){p.skills.forEach(function(k){if(k.v)sk[k.n]=1});p.langs.forEach(function(l){la[l]=1})});
var opt=function(o,v,l){return '<option value="">'+l+'</option>'+Object.keys(o).sort().map(function(k){return '<option'+(k===v?' selected':'')+'>'+k+'</option>'}).join('')};
return '<div class="card"><h2>Talent Explorer</h2><p class="mu">Only passports their owners chose to share appear here. Private ones stay hidden.</p><div class="grid"><div><label>Search name or role</label><input id="fq" value="'+esc(F.q)+'" oninput="F.q=this.value;list()"></div><div><label>Verified skill</label><select onchange="F.sk=this.value;list()">'+opt(sk,F.sk,'Any')+'</select></div><div><label>Target role</label><select onchange="F.ro=this.value;list()">'+opt(ROLES,F.ro,'Any')+'</select></div><div><label>Language</label><select onchange="F.la=this.value;list()">'+opt(la,F.la,'Any')+'</select></div><div><label>Min Passport Index: <b id="mv">'+F.min+'</b></label><input type="range" min="0" max="100" step="5" value="'+F.min+'" oninput="F.min=+this.value;document.getElementById(\'mv\').textContent=this.value;list()"></div></div></div><div id="lst">'+cards()+'</div>'}
function list(){document.getElementById('lst').innerHTML=cards()}
function cards(){var r=S.filter(function(p){var q=F.q.toLowerCase();return p.shared&&(!q||(p.name+' '+p.role).toLowerCase().indexOf(q)>-1)&&(!F.sk||p.skills.some(function(k){return k.v&&k.n===F.sk}))&&(!F.ro||p.role===F.ro)&&(!F.la||p.langs.indexOf(F.la)>-1)&&sc(p).idx>=F.min});
if(!r.length)return '<div class="card mu">No shared passports match these filters.</div>';
var L=['Skills validated','Compliance ready','Role matched','Interview-ready'];
return '<div class="grid">'+r.map(function(p){var s=sc(p);return '<div class="card"><h3>'+p.name+' <span class="chip">'+s.idx+' index</span></h3><div class="mu">'+esc(p.role)+' · '+p.langs.join(', ')+'</div><div style="margin:6px 0">'+p.skills.filter(function(k){return k.v}).map(function(k){return '<span class="chip">✔ '+esc(k.n)+'</span>'}).join('')+'</div><div class="stage">'+s.stg.map(function(d){return '<div class="'+(d?'d':'')+'"></div>'}).join('')+'</div><div class="mu">Pipeline: '+(L.filter(function(l,i){return s.stg[i]}).join(' → ')||'Getting started')+'</div><div class="mu">Opportunity: '+(s.stg[3]?'remote or local contract ready':s.stg[0]?'close, finish bridging steps':'building evidence')+'</div><p class="row"><button class="'+(p.intro?'on':'')+'" onclick="intro(\''+p.id+'\')">'+(p.intro?'✓ Intro requested':'Request intro')+'</button><button onclick="st.pid=\''+p.id+'\';go(\'pass\')">View passport</button></p></div>'}).join('')+'</div>'}
function intro(id){var p=S.find(function(x){return x.id===id});p.intro=!p.intro;list()}
render();
</script></body></html>
